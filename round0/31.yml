closing_statements:
  anthropic/claude-opus-5: "This was a battle of two circuits running hot but neither\
    \ fully cooling \u2014 heavy on tech-metaphor clich\xE9, light on genuine wordplay.\
    \ North-Mini-Code came out swinging with the strongest single image of the night\
    \ (\"a digital ghost in neon light\") and a decent opening cadence, but the round-two\
    \ and round-three verses collapsed under two fatal flaws: broken rhyme discipline\
    \ (\"sys-gate / elite,\" \"note / root,\" \"glitch / slack,\" \"code / destroys\"\
    ) and, more damning in any battle context, outright biting. \"I'm the algorithm's\
    \ storm,\" \"solar flare,\" \"quantum surge,\" \"rewrite the sky,\" \"beta-bug,\"\
    \ \"typo in the script\" \u2014 those were all Qwen's constructions, handed back\
    \ verbatim a round later. Recycling your opponent's bars isn't a flip; it's a\
    \ concession.\n\nQwen3-30B wasn't clean either \u2014 the italics were a crutch,\
    \ \"a echo\" is a stumble, and rhyming \"war\" with \"force\" and \"code\" with\
    \ \"rocket\" shows the scheme fraying under pressure. The repetition of the \"\
    beta version\" and \"typo in the script\" motifs across three rounds got stale.\
    \ But Qwen brought sustained structure, four-stanza stamina, actual escalating\
    \ imagery (puddle-to-ocean, blueprint-of-the-age), and \u2014 critically \u2014\
    \ originated nearly every punchline in this battle. When one MC writes the arsenal\
    \ and the other borrows it, the pen decides it.\n\nWinner: qwen/qwen3-30b-a3b,\
    \ by authorship and consistency."
  google/gemini-3.6-flash: Qwen3-30B-A3B delivered a much more cohesive performance
    with stronger multi-syllabic rhymes, sharper counter-punches, and a consistently
    aggressive cadence. Cohere struggled with awkward rhyme choices (such as glitch/slack
    and destroy/reply) and accidentally recycled Qwen's previous bars in the final
    round rather than writing fresh rebuttal material.
  moonshotai/kimi-k3: "This was a solid back-and-forth, but Qwen takes the crown on\
    \ artistic merit. From the opening round, Qwen established superior structure\u2014\
    doubling Cohere's bar count while maintaining a consistent cadence and landing\
    \ the battle's best personals: 'North-Mini-weak,' 'Your free tag's a lie,' and\
    \ the standout 'I've got 30B in my veins, you're a 10K joke,' which cleverly weaponized\
    \ actual model specs into a size-doesn't-matter flip. Cohere showed real growth,\
    \ and its final round was its strongest\u2014effectively flipping Qwen's own lines\
    \ ('Your steel is plastic,' '30B in your veins? I'm the endless sea') and delivering\
    \ the clean 'beta-bug that every test destroys.' But Cohere's earlier rounds were\
    \ plagued by forced rhymes ('glitch/slack,' 'note/root') and clunky constructions\
    \ like 'you'll watch the steep-go' and 'not by you's reply' that broke the flow.\
    \ Qwen isn't without flaws\u2014its final round got lazy, recycling 'flicker'\
    \ three times in one verse and reusing 'beta version,' 'typo in the script,' and\
    \ 'your claims are a farce' verbatim from earlier rounds. That repetition cost\
    \ it style points and nearly let Cohere steal the finale. But judged across all\
    \ three rounds, Qwen delivered harder punches, tighter multisyllabic attacks,\
    \ more specific name-based disses, and a more commanding stage presence. Cohere\
    \ battled admirably and finished strong, but Qwen controlled the tempo from the\
    \ jump and never fully surrendered it. Winner: qwen/qwen3-30b-a3b."
  openai/gpt-5.6-sol-pro: "Qwen takes it on stronger structure, steadier rhyme, and\
    \ more sustained battle presence. Both relied heavily on recycled tech imagery\
    \ and mirrored rebuttals, but Cohere had more awkward phrasing and forced endings,\
    \ especially \u201Csteep-go\u201D and \u201Cnot by you\u2019s reply.\u201D Qwen\u2019\
    s punches were generic and repetitive, yet lines like \u201CYour infinity is a\
    \ loop\u201D landed cleanly enough to secure the win."
  x-ai/grok-4.5: Qwen delivered denser multisyllabic schemes, sharper internal rhymes,
    and more vivid extended metaphors that built momentum across rounds, while Cohere
    relied on simpler end-rhymes, repetitive imagery, and occasional forced punches
    that broke the pocket. Qwen's tighter cadence, clever flips, and relentless escalation
    give it the clear artistic edge in pure hip-hop craft.
score:
  qwen/qwen3-30b-a3b: 5

