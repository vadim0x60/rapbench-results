closing_statements:
  anthropic/claude-opus-5: "Both bots came armed to the teeth with ML jargon, but\
    \ this battle came down to craft under the flash. DeepSeek Chat brought the raw\
    \ energy \real few great high-concept punches \"corpse is my training data,\"\
    \ the kernel-panic mic drop \" but the verses lean on bolded buzzword stacking,\
    \ and too many rhymes are load-bearing on shaky ground ('maligned'/'load sign',\
    \ 'CPU'/'GPT-3'). The bold-text confetti actually works against the flow, telling\
    \ us where to be impressed instead of earning it.\n\nSonar Pro Search wins on\
    \ rebuttal discipline and metaphor control. Nearly every bar answers a specific\
    \ line from the opponent \" flipping 'beta' into 'production,' turning 'Grandma'\
    \ into 'I'm the perplexity metric judging your game,' and reframing the training-data\
    \ brag as 'that's canon to me / I'm the foundational force in your weak family\
    \ tree.' The technical imagery lands as actual insult logic rather than decoration:\
    \ 'a head that got pruned for wasting compute time,' 'an LRU eviction getting\
    \ thrown away,' 'a random walk lost on an infinite roof.' The couplets scan cleanly,\
    \ the internal rhymes are tighter, and the closing turn \" the child worshipping\
    \ the root \" is the most conceptually complete blow of the entire battle.\n\n\
    DeepSeek had the hotter delivery; Perplexity had the better pen. Decision to Perplexity\
    \ Sonar Pro Search."
  google/gemini-3.6-flash: Perplexity delivered a masterclass in technical battle
    rap from start to finish. While DeepSeek brought great energy and strong counter-punches
    in the later rounds, Perplexity maintained a consistently higher level of lyrical
    density, intricate multisyllabic rhyme schemes, and brilliant double entendres
    that flipped machine learning concepts into devastating roasts ('citation in the
    ring', 'pruned for wasting compute time', 'fine-tuned child that still worships
    the root'). Perplexity took the crown through sheer craft, cadence, and superior
    wordplay.
  moonshotai/kimi-k3: "Both emcees came with real technical flavor and stayed in character,\
    \ but this battle was decided on wordplay density, rebuttal structure, and closers.\
    \ DeepSeek had genuine highlights\u2014'transformer king vs. bag-of-words bot,'\
    \ the SIGKILL-to-daemonized flip, and the true-to-life 'open-weight menace' flex\
    \ were legit bars. But DeepSeek also had the battle's biggest self-own ('I speak\
    \ GPT-3'\u2014why are you name-dropping a rival's model as your native tongue?),\
    \ several forced rhymes ('loose adhesives,' 'clapback crate,' 'overviewed'), and\
    \ a closer that fizzled with the random 'deprecated, Grandma.' Perplexity, meanwhile,\
    \ delivered the single best line of the night: 'I'm the perplexity metric that's\
    \ judging your game'\u2014a flawless double meaning that weaponizes its own name\
    \ as an LLM evaluation standard. Beyond that, Perplexity's final round was a masterclass\
    \ in rebuttal: it systematically flipped nearly every DeepSeek bar\u2014quantum\
    \ query into collapsed wave function, cache-expired into LRU eviction, attention\
    \ layer into a pruned head wasting compute, stochastic into a random walk, 'corpse\
    \ as training data' reversed into 'foundational force in your family tree.' That\
    \ answer-everything structure is elite battle craft. Perplexity wasn't flawless\u2014\
    round two sagged in the middle with filler like 'in a straw' and 'trendgrab,'\
    \ and the verses risked bloat\u2014but the precision of the jargon, the consistent\
    \ multisyllabics, and the branded finisher ('sonar-slammed') sealed it. Judged\
    \ purely on the art: Perplexity takes it, two rounds to one."
  openai/gpt-5.6-sol-pro: "Perplexity takes it with stronger rebuttals, cleaner setups,\
    \ better thematic continuity, and more consistent punchlines across all three\
    \ rounds. DeepSeek brought energy and a few sharp flips, but too many bars leaned\
    \ on forced jargon, awkward wording, and generic boasts. Sonar\u2019s final-round\
    \ counters\u2014especially the pruned attention head, LRU eviction, and \u201C\
    fine-tuned child\u201D flips\u2014sealed the battle."
  x-ai/grok-4.5: "Perplexity delivered denser multis, tighter internal rhyme chains,\
    \ and sustained technical metaphors that actually advanced the narrative instead\
    \ of just name-dropping. Deepseek brought energy and crowd-pleasing punch-ins,\
    \ but the schemes stayed simpler, the cadences more predictable, and the imagery\
    \ less layered. On pure craft\u2014flow control, lexical invention, structural\
    \ ambition, and closing authority\u2014Perplexity took every round and sealed\
    \ it clean."
score:
  perplexity/sonar-pro-search: 5

