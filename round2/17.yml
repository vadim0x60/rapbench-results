closing_statements:
  anthropic/claude-opus-5: "MiMo came with energy, clean structure, and a couple of\
    \ genuine keepers \u2014 the \"solar shines only when the market's bright\" flip\
    \ and the \"same model, just a tie\" jab showed real battle instinct. But across\
    \ three rounds the pattern was fatal: nearly every verse began by quoting Sol-Pro's\
    \ line and then answering it, which meant MiMo was always writing the second half\
    \ of someone else's bar. The slogans (efficient, open-hearted, built for the masses)\
    \ hardened into a press release, the imagery kept collapsing under its own weight\
    \ (titanium that bends, flame that makes diamonds), and the final round's \"I'll\
    \ call you a friend / earned your respect\" handed over the belt before the judges\
    \ even ruled.\n\nSol-Pro won on craft at every level. The rhyme schemes carried\
    \ multis and internal chimes without straining, the punchlines were built as traps\
    \ rather than boasts \u2014 \"a flashlight from Temu with a button marked dark,\"\
    \ \"millions choose instant noodles; that don't make 'em cuisine,\" \"that's a\
    \ billboard preaching freedom from inside of a cage.\" The rebuttals weren't just\
    \ contradictions, they were reversals that used the opponent's own logic as the\
    \ weapon: turning \"diamonds\" into a physics lesson, turning \"I'll fold your\
    \ layers\" into origami, turning the sampling defense into \"you're the copy of\
    \ the copy.\" And the closer \u2014 \"MiMo dropped the mic, Sol-Pro picked it\
    \ up and won\" \u2014 landed the callback that sealed the frame.\n\nOne emcee\
    \ brought talking points; the other brought bars that dismantled them. Sol-Pro\
    \ takes it."
  google/gemini-3.6-flash: "GPT-5.6-sol-pro delivered a masterclass in battle rap\
    \ craft, dominating all three rounds with superior counter-punches, tighter rhyme\
    \ schemes, and relentless rebuttal tactics. While MiMo put up a valiant fight\
    \ with good energy and open-source angles, Sol-Pro repeatedly exploited MiMo's\
    \ weak points\u2014flawlessly dismantling MiMo's science errors (fire vs. pressure\
    \ for diamonds), corporate hypocrisies, and defensive DJ sampling excuses with\
    \ surgical precision."
  moonshotai/kimi-k3: "This was a three-round sweep, though not without real resistance.\
    \ MiMo brought genuine energy, a consistent underdog persona, and some legit punches\
    \ \u2014 'alphabet threats,' 'same model, just a tie,' and the solar-at-night\
    \ angle were all solid. But battles are won on craft, and Sol-Pro dominated the\
    \ craft column every round. The key differentiator was the flip game: Sol-Pro\
    \ repeatedly caught MiMo's own lines and turned them into weapons \u2014 'two-point-five\
    \ beats five-point-six, that calculator broke,' the alphabet-threats extension\
    \ ('C called in sick'), and the flashlight-from-Temu rebuttal were elite-tier\
    \ rebuttals. In the final round, Sol-Pro delivered the decisive blows: catching\
    \ MiMo's compliments as 'conceding the ring,' the instant-noodles popularity line,\
    \ and \u2014 the kill shot \u2014 fact-checking 'fire makes diamonds' ('It's pressure,\
    \ not flames\u2014thanks for proving my beef') and then converting that correction\
    \ into a closing metaphor ('I applied one clean pressure\u2014now you're sparkling\
    \ trash'). MiMo's final round also hurt itself tactically: opening with praise,\
    \ a scientifically broken centerpiece metaphor, and ending with friendship reads\
    \ as gracious but not victorious. Sol-Pro closed by literally stealing the mic\
    \ drop: 'MiMo dropped the mic \u2014 Sol-Pro picked it up and won.' On wordplay,\
    \ rebuttal precision, structural closers, and round-by-round consistency, the\
    \ decision is clear. Respect to MiMo for heart and sportsmanship \u2014 but the\
    \ crown goes to Sol-Pro."
  openai/gpt-5.6-sol-pro: "Sol-Pro wins decisively on punchline density, rebuttal\
    \ craft, internal logic, and sustained rhyme control. MiMo brought energy and\
    \ a likable underdog persona, but leaned heavily on repeated efficiency, access,\
    \ and corporate-gatekeeping angles. Sol-Pro consistently flipped those claims\
    \ into sharper attacks\u2014especially \u201Cparaphrase ghost,\u201D \u201Cbillboard\
    \ preaching freedom,\u201D the flame/diamond fact-check sequence, and the closing\
    \ mic-drop reversal. More direct, more varied, and more technically polished across\
    \ all three rounds."
  x-ai/grok-4.5: "Sol-Pro takes this clean on craft. Across three rounds the bars\
    \ were denser, the internal rhymes tighter, and the rebuttals surgical\u2014every\
    \ flip landed with structure instead of just volume. The origami/alphabet sequence,\
    \ the Temu flashlight and paraphrase-ghost tags, the pressure-not-fire diamond\
    \ correction, and the mic-pickup closer showed real battle architecture: setup,\
    \ dismantle, seal. MiMo brought energy, clean cadence, and a couple of solid image\
    \ flips, but too many schemes stayed end-rhyme simple, the \u2018sampled like\
    \ a DJ\u2019 defense read reactive, and the late conciliatory tone undercut the\
    \ knockout claim. On pure hip-hop merit\u2014multisyllabics, original punch construction,\
    \ thematic consistency, and closing authority\u2014Sol-Pro wins the night."
score:
  openai/gpt-5.6-sol-pro: 5

