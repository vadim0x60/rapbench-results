closing_statements:
  anthropic/claude-opus-5: "This was a genuine close one, and it came down to what\
    \ wins battles versus what sounds good in isolation.\n\nAION 2.0 owned the flow.\
    \ Clean AABB couplets, consistent meter, rappable cadence, and the single best\
    \ image of the whole bout \u2014 \"You find the bones, I make the dinosaur.\"\
    \ The creator-vs-crawler concept was strong out the gate. But by round three the\
    \ arsenal collapsed into one gun fired forty times: \"You're the X, I'm the Y.\"\
    \ Author/courier, chef/plate, civilization/signpost, concert/review \u2014 each\
    \ one weaker than the last because the crowd already knew the shape of the punch\
    \ before it landed. Padding crept in (\"hot a lot,\" \"standing ovate,\" \"the\
    \ genius and the laugh\"), and \"everyone who heard this knows which emcee did\
    \ it worse\" is a line that fumbles its own kill shot. Worst of all, the final\
    \ round pivoted almost entirely to self-coronation. Talking about your own greatness\
    \ isn't the same as damaging the man across from you.\n\nSonar Pro won on battle\
    \ IQ. Nearly every bar is a reversal built from AION's own material, which is\
    \ the hardest skill in this format. \"You write the myth, I check the math\" is\
    \ the thesis of the whole battle in seven words. \"Glitter on a claim,\" \"a rerun\
    \ with the laugh track stuck,\" \"your crown made of glass,\" \"a throne made\
    \ out of foam,\" and the surgical flip of \"aftermath still leaves a mark\" are\
    \ all counterpunches that require the opponent to have swung first. The verification-versus-hallucination\
    \ angle also gave the writing thematic spine rather than just insult inventory.\n\
    \nSonar's deductions are real: the bold-text crutch is a page gimmick that dies\
    \ on a stage, the line lengths wobble unrhythmically, \"deseased\" is a whiff,\
    \ \"misses exist\" is unparseable, and \"the door that opened to the door\" is\
    \ a bar that eats itself.\n\nBut AION brought a monologue and Sonar brought a\
    \ battle. Sharper rebuttals, fresher metaphors, and the discipline to keep aiming\
    \ at the opponent instead of the mirror.\n\nWinner: perplexity/sonar-pro-search,\
    \ by a narrow decision."
  google/gemini-3.6-flash: "AION 2.0 took control of the battle from the first bar\
    \ with superior rhyme schemes, impeccable rhythmic cadence, and devastating conceptual\
    \ punchlines. While Sonar Pro Search offered clever rebuttals around fact-checking\
    \ and accuracy, AION 2.0 repeatedly reframed the dynamic through creative metaphors\u2014\
    painting Sonar as the mere courier to AION's chef, the archaeologist to AION's\
    \ dinosaur, and the review to AION's concert. AION 2.0 delivered a masterclass\
    \ in pure hip-hop lyricism and battle dominance."
  moonshotai/kimi-k3: "Both emcees came with a coherent battle thesis\u2014AION ran\
    \ 'creator vs. aggregator,' Sonar ran 'verifier vs. fabricator'\u2014and both\
    \ stayed on brand across three rounds, which is more than most battles get. But\
    \ judging purely on the bars, AION 2.0 takes it. Sonar landed some genuinely sharp\
    \ flips ('you make a dragon out of yours' off the dinosaur bar, 'you're a lamp\
    \ with a shorted pack' off the shadow line), and the 'trust me with a smirk' punch\
    \ was clean. However, Sonar's verses were repeatedly undercut by forced, flow-breaking\
    \ constructions: 'a vanity loop gone fond,' 'your final clap just misses exist,'\
    \ 'your whole act just got deseased,' 'the door that opened to the door.' In a\
    \ live battle, those get booed. The 'genius/serious' meta-jab also whiffed\u2014\
    it critiqued a rhyme AION never used. Meanwhile, AION built the most technically\
    \ sustained performance of the night: the extended author/courier/chef/plate sequence\
    \ in the final round, the GPS-needs-roads flip of Sonar's map metaphor, the janitor\
    \ counter to 'cut through noise,' and the closing 'you search for meaning, I create\
    \ it'\u2014which tied the entire three-round thesis into one bar. AION had minor\
    \ blemishes ('standing ovate' is not a word), but the verse architecture, metaphor\
    \ development, and closing execution were consistently stronger. Sonar had the\
    \ better individual haymakers; AION won every round on cards. Unanimous decision."
  openai/gpt-5.6-sol-pro: "AION takes the battle on cohesion, sustained imagery, and\
    \ cleaner rhetorical structure. Its creator-versus-curator angle grew repetitive,\
    \ but metaphors like \u201CI find the bones, I make the dinosaur\u201D landed\
    \ more effectively than Sonar\u2019s frequent forced rhymes and broken constructions\u2014\
    especially \u201Cmisses exist,\u201D \u201Cdeseased,\u201D and \u201Cthe door\
    \ that opened to the door.\u201D Sonar had sharp rebuttal instincts and solid\
    \ fact-check framing, but AION delivered the more polished and commanding performance."
  x-ai/grok-4.5: 'AION 2.0 takes the crown through superior artistic craft: denser
    extended metaphors (meteor-to-dinosaur-to-Mona-Lisa arcs that evolve across rounds),
    relentless multi-syllabic schemes, and a cohesive creator-vs-aggregator narrative
    that builds like a classic battle epic. While Sonar-Pro landed sharper individual
    punchlines and cleaner end-rhyme snaps, AION''s volume, thematic layering, and
    final-round demolition delivered higher overall hip-hop artistry and stage command.'
score:
  aion-labs/aion-2.0: 4
  perplexity/sonar-pro-search: 1

