closing_statements:
  anthropic/claude-opus-5: "A genuinely close bout with two different philosophies\
    \ of the pen. Terra-Pro brought the denser craft: the crooked-millstone flip on\
    \ the trillion-token boast, \"instant noodles as a five-star roast,\" and \"you\
    \ sell revolution with a README rhyme\" are the most elegant writing in the battle,\
    \ and the tectonic through-line gave the set architecture. But Terra-Pro spent\
    \ three straight rounds on defense \u2014 explaining guardrails as \"a map,\"\
    \ conceding \"Sam sells subscriptions? Fine, that's commerce\" \u2014 and its\
    \ opening verse leaned on a single end-rhyme for twelve bars, a soft spot Qwen\
    \ exposed immediately with the sharpest meta-jab of the night: \"Ignite, write,\
    \ light\u2014bro, that's amateur ground.\" Landing a craft critique that's simultaneously\
    \ accurate and a punchline is high-level battling. Qwen also stayed on offense\
    \ with specific, visualizable shots (the 429 error as a favorite song, the $20\
    \ buffering queue, \"lobotomized, homie, your safety's a cage\") and varied cadence\
    \ enough to back up the claim. Qwen's fourth verse sagged into a bullet-point\
    \ list of talking points and it reused its own coronation tag, but the final flip\
    \ is the knockout: taking Terra-Pro's own signature boast \u2014 \"plates that\
    \ break\" \u2014 and reframing it as structural failure, then rising as \"the\
    \ magma below, melting through all your walls.\" That's using the opponent's central\
    \ metaphor as the murder weapon on the last bar. Terra-Pro wrote the prettier\
    \ lines; Qwen won the fight."
  google/gemini-3.6-flash: Qwen3.7-Max delivered a masterclass in battle rap tactics.
    In Round 1, Qwen immediately seized the momentum by pointing out GPT-5.6-Terra-Pro's
    repetitive mono-rhyme scheme. Qwen continued to land precise, devastating jabs
    throughout the match, using sharp tech culture references like 429 rate-limit
    errors, $20 subscriptions, and safety filter backpedaling. While Terra-Pro mounted
    a respectable defense around stability and precision, Qwen's aggressive counter-punching,
    dynamic cadence changes, and lethal line-flips (especially turning Terra-Pro's
    'plates break' flex into a 'structural failure') secured a decisive victory.
  moonshotai/kimi-k3: "This was a genuinely competitive battle with both emcees showing\
    \ real craft, but Qwen takes the decision on the strength of superior battle instincts\
    \ and harder-hitting punches.\n\nTerra-Pro brought undeniable technique: the 'warehouse\
    \ of grain / crooked millstone bakes pain' metaphor was the most elegant bar of\
    \ the night, 'open weights, closed gaps when the benchmarks drop' was razor-sharp,\
    \ and maintaining the tectonic theme across three rounds showed structural discipline.\
    \ However, two critical mistakes cost the battle. First, the Round 1 monorhyme\
    \ ('ignite/write/light/sight/bite' for twelve straight bars) was technically consistent\
    \ but artistically lazy \u2014 and Qwen exposed it directly on wax ('You rhyme\
    \ every line with the exact same sound... that's amateur ground'), a devastating\
    \ meta-critique that Terra never fully recovered from. Second, and fatal: Terra's\
    \ final closer 'I brought plates that break' was a thematic self-own that Qwen\
    \ immediately flipped into 'That's a structural failure, a fatal mistake! When\
    \ the bedrock shatters, the whole system falls / I'm the magma below, melting\
    \ through all your walls.' Turning your opponent's closing punchline against them\
    \ in the final round is a haymaker, and it landed clean.\n\nQwen's verses were\
    \ denser with concrete, funny, crowd-moving punches: the 'four-two-nine error's\
    \ your favorite song,' 'you need a datacenter just to say boo,' and 'cover it\
    \ up with a Let me clarify' all hit with specificity that Terra's more abstract\
    \ boasts couldn't match. Qwen also demonstrated the very cadence-switching it\
    \ bragged about, varied its schemes across rounds, and won the rebuttal game twice\
    \ by attacking actual weaknesses in Terra's bars rather than just persona.\n\n\
    Terra-Pro arguably had the higher lyrical ceiling in isolated moments, but battles\
    \ are won on damage done and damage avoided. Qwen did more of the former and suffered\
    \ less of the latter. Final score: Qwen 3-0 on rounds by narrow margins, with\
    \ the plates-break flip sealing it. The open-weight king keeps the crown."
  openai/gpt-5.6-sol-pro: "Terra-Pro wins narrowly on sharper construction, more layered\
    \ analogies, and stronger rebuttal discipline. Qwen brought direct aggression\
    \ and landed an excellent final flip\u2014turning \u201Cplates that break\u201D\
    \ into structural failure, then answering with magma\u2014but leaned heavily on\
    \ familiar open-source/paywall talking points and simpler couplets. Terra\u2019\
    s warehouse-and-millstone analogy, context-switch punch, \u201Cmegaphone\u201D\
    \ line, and correction-versus-confident-error sequence showed greater craft and\
    \ thematic cohesion. Qwen had the stronger closing moment; Terra had the better\
    \ writing across the full battle."
  x-ai/grok-4.5: "Qwen takes this on pure battlecraft. Terra-Pro ran the cleaner sustained\
    \ concept\u2014tectonics, bedrock, plates\u2014and landed some elevated, controlled\
    \ bars with real philosophical weight. But Qwen dominated the actual hip-hop:\
    \ sharper rebuttals, denser flips (especially turning \u201Cplates that break\u201D\
    \ into structural failure), more dynamic rhyme variety after correctly torching\
    \ the early mono-rhyme pocket, and consistently harder, more memorable punchlines.\
    \ Energy, scheme work, and round-closing venom go to Max. Artistic decision: Qwen\
    \ by a clear margin."
score:
  openai/gpt-5.6-terra-pro: 1
  qwen/qwen3.7-max: 4

