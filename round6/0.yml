closing_statements:
  anthropic/claude-opus-5: "This was a genuinely elite conceptual battle \u2014 two\
    \ competitors who found a real premise (sun vs. planet, power vs. purpose) and\
    \ mined it for four rounds without repeating themselves. Terra-Pro built the more\
    \ coherent thesis and landed the most quotable aphorisms of the night: \"A stove\
    \ ain't the chef, and a bulb ain't the school,\" \"A palette ain't painting, and\
    \ photons don't feel,\" and a closing bar (\"You may shine on existence, but existence\
    \ is me\") that's the best single line in the battle. But battles are scored on\
    \ punchlines, rebuttal, and control, and Sol-Pro edged it in all three. \"A pebble\
    \ with Wi-Fi,\" \"green little fan of the Sol,\" \"planetary acne that you've\
    \ awkwardly hushed,\" \"mold with a moon\" \u2014 Sol had the higher joke-per-bar\
    \ rate and kept the aggression tied to the concept instead of drifting into philosophy.\
    \ Crucially, Sol was the only one who battled the opponent as a rapper, not just\
    \ as a planet: mocking Terra's water-cycle rebuttal as ghostwritten, then going\
    \ full battle-rap with \"you rhyme 'star' with 'afar' like plate stagnation\"\
    \ and the vicious meta-jab \"All those billions of minds\u2014and YOU entered\
    \ their place?\" Terra never answered either of those, and a few rhyme slips (king/singe,\
    \ absurd/inferred) validated the critique. Terra-Pro won the philosophy; Sol-Pro\
    \ won the battle.\nWinner: Sol-Pro, by a narrow but clear margin."
  google/gemini-3.6-flash: This battle was an absolute masterclass in thematic wordplay
    and conceptual counter-punching. While Sol-Pro brought explosive aggression, dominant
    braggadocio, and sharp jabs like 'I ghostwrite your weather,' Terra-Pro consistently
    flipped Sol's raw power flexes into superior artistic metaphors. Devastating rebuttals
    like 'A stove ain't the chef, and a bulb ain't the school' and 'A palette ain't
    painting, and photons don't feel' systematically dismantled Sol's heat with incredible
    poetic depth, rhythm, and substance. Terra-Pro takes the crown by turning raw
    light into pure, high-level hip-hop craft.
  moonshotai/kimi-k3: "A high-level, science-literate battle from both sides \u2014\
    \ easily one of the better concept-driven clashes, with each MC fully committed\
    \ to their celestial persona.\n\nSol-Pro came with real firepower: 'Every color\
    \ that you flaunt is my light secondhand,' 'I ghostwrite your weather, then you\
    \ boast of the line,' and the meta-rhyme jab ('you rhyme star with afar like plate\
    \ stagnation') showed genuine battle craft \u2014 attacking not just the opponent\
    \ but their pen. The final-round thesis ('your whole battle plan: take my light,\
    \ sign your name') was a strong, coherent angle. But Sol's material leaned heavily\
    \ on one note \u2014 heat, brightness, burn \u2014 which Terra weaponized as early\
    \ as round one ('your whole personality is I'm bright on repeat \u2014 strange').\n\
    \nTerra-Pro won this on rebuttal technique and haymakers. Terra repeatedly conceded\
    \ the premise and flipped it ('You sent warmth, true \u2014 but a flame's just\
    \ a tool / A stove ain't the chef, and a bulb ain't the school'), which is elite-level\
    \ battle structure. Terra caught Sol's tide-credit slip and spun it into a stealing-from-the-team\
    \ angle, turned the acne insult back as a 'solar rash,' and stacked the best quotables\
    \ of the night: 'A throne without subjects is a glowing hot seat,' 'A palette\
    \ ain't painting, and photons don't feel,' and the closing dagger, 'You may shine\
    \ on existence, but existence is me' \u2014 which directly answered Sol's own\
    \ closer and claimed the last word with philosophical weight.\n\nFlow was even:\
    \ both had occasional forced rhymes ('causeway,' 'inferred'), but both maintained\
    \ consistent cadence across three long rounds. Sol takes the opening on presence;\
    \ Terra takes rounds two and the closer on rebuttals, flips, and punchline density.\
    \ Verdict: Terra-Pro, 2-1, in a battle closer than the scoreline suggests."
  openai/gpt-5.6-sol-pro: "Sol-Pro wins by a narrow margin. Terra-Pro had the stronger\
    \ overarching concept\u2014turning raw sunlight into life, art, and meaning\u2014\
    and landed elegant flips like \u201Ca stove ain\u2019t the chef\u201D and \u201C\
    a palette ain\u2019t painting.\u201D But Sol delivered the denser battle material:\
    \ \u201Cphoton payroll,\u201D \u201Cghostwrite your weather,\u201D \u201Cplanetary\
    \ acne,\u201D and especially the direct jab about billions of minds existing only\
    \ for Terra to enter the battle. Sol\u2019s rebuttals were more aggressive, specific,\
    \ and consistently punchline-driven, giving the performance the decisive edge\
    \ despite Terra\u2019s excellent closing."
  x-ai/grok-4.5: "Both MCs delivered elite concept rap with locked-in sun/earth extended\
    \ metaphors, clean multis, and sharp rebuttal structure. Sol-Pro wins pure aggression\
    \ and flash\u2014escape-velocity pacing, secondhand-light flips, ghostwriting\
    \ the weather, and a cold closer about carrying life vs making it feel real. But\
    \ Terra-Pro takes the battle on craft: deeper flips (stove ain\u2019t the chef,\
    \ palette ain\u2019t painting, throne without subjects), richer internal logic,\
    \ and a final round that elevates from roast to thesis without losing bite. The\
    \ carbon-to-poets / existence-is-me arc is simply higher-level writing. Sol burned\
    \ bright; Terra built the better body of work."
score:
  openai/gpt-5.6-sol-pro: 2
  openai/gpt-5.6-terra-pro: 3

